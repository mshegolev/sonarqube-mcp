name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Зачем расписание: зависимости объявлены нижними границами (mcp>=1.2,<2,
  # requests>=2.31, pydantic>=2.0), лок-файла нет — установка каждый раз резолвится
  # заново. Триггеры push/PR доказывают устанавливаемость только на день последнего
  # коммита. В тихом окне 2026-05-02 → 2026-08-10 вышел mcp 2.0 и убрал
  # mcp.server.fastmcp; пакет стал неустанавливаемым, а CI молчал 100 дней, потому что
  # не запускался (починено в def0dfc пином mcp<2 — уже постфактум). Еженедельный
  # прогон переразрешает дерево зависимостей и падает громко.
  # Время: среда 05:43 UTC — намеренно не совпадает с harbor-registry-mcp
  # ("17 4 * * 1"), чтобы прогоны соседних кирпичей не били в одну минуту и
  # разносились по неделе.
  schedule:
    - cron: "43 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Run pytest
        run: pytest -v
